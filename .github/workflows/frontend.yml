name: Frontend

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
        working-directory: frontend
      - name: Unit tests
        run: npm test
        working-directory: frontend
      - name: TypeScript and production build
        run: npm run build
        working-directory: frontend
      - name: Formatting
        run: npm run format:check
        working-directory: frontend
      - name: Create development configuration
        run: python3 scripts/init_env.py
      - name: Start complete application
        run: docker compose --profile frontend up --build -d --wait frontend worker
      - name: Create local test administrator
        run: python3 scripts/bootstrap_admin.py
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser fixtures and real backend acceptance
        run: npm run test:e2e
        working-directory: frontend
        env:
          RUN_LIVE_UI: '1'
          UI_EXTERNAL_SERVER: '1'
      - name: Stop CI services
        if: always()
        run: docker compose --profile frontend down
