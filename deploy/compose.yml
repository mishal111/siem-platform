name: siem-hardened

services:
  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: siem_root
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
      MONGO_INITDB_DATABASE: siem
    secrets:
      - mongo_root_password
      - mongo_app_password
      - mongo_tools_config
      - mongo_restore_config
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/01-siem.js:ro
    networks: [database]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    mem_limit: 768m
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      target: base
    environment: &app_environment
      SIEM_SECRETS_DIR: /run/secrets
      MONGO_DB: siem
      DEPLOYMENT_MODE: hardened
      ALLOW_LEGACY_KEYS: "false"
      ALLOWED_HOSTS: '["${SIEM_DOMAIN:-localhost}","localhost","127.0.0.1"]'
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
    secrets: [mongo_uri]
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--no-access-log", "--proxy-headers", "--forwarded-allow-ips", "172.30.53.2", "--timeout-keep-alive", "5"]
    networks:
      database: {}
      proxy:
        ipv4_address: 172.30.53.3
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 15
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 640m
    pids_limit: 128
    restart: unless-stopped

  worker:
    build:
      context: ../backend
      target: base
    command: ["python", "-m", "app.detections.worker"]
    environment: *app_environment
    secrets: [mongo_uri]
    networks: [database]
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.detections.worker", "--health-check"]
      interval: 10s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    restart: unless-stopped

  caddy:
    image: caddy:2.11.4-alpine
    environment:
      SIEM_DOMAIN: ${SIEM_DOMAIN:-localhost}
      SIEM_PUBLIC_HTTPS_PORT: ${SIEM_HTTPS_PORT:-8443}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${SIEM_BIND:-127.0.0.1}:${SIEM_HTTPS_PORT:-8443}:443"
      - "${SIEM_BIND:-127.0.0.1}:${SIEM_HTTP_PORT:-8080}:80"
    networks:
      proxy:
        ipv4_address: 172.30.53.2
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2018/health"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

networks:
  database:
    internal: true
  proxy:
    ipam:
      config:
        - subnet: 172.30.53.0/24

volumes:
  mongo_data:
  caddy_data:
  caddy_config:

secrets:
  mongo_root_password:
    file: ../.local/deployment-secrets/mongo_root_password
  mongo_app_password:
    file: ../.local/deployment-secrets/mongo_app_password
  mongo_uri:
    file: ../.local/deployment-secrets/mongo_uri
  mongo_tools_config:
    file: ../.local/deployment-secrets/mongo_tools_config
  mongo_restore_config:
    file: ../.local/deployment-secrets/mongo_restore_config
